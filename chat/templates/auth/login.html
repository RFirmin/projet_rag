{% extends "chat/base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div class="content">
    <h2>Connexion</h2>
    <form action="{% url 'login' %}" method="post" style="margin-top: 20px; max-width: 400px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Se connecter</button>
    </form>
</div>
{% endblock %}
