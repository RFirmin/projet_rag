[project]
name = "projet-rag"
version = "0.1.0"
description = "IA assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "django-ratelimit>=4.1.0",  
    "django-redis>=5.4.0",
    "django-allauth-ui>=1.8.1",
    "django-allauth[socialaccount]>=65.20.0",
    "easyocr==1.7.2",
    "groq==1.7.0",
    "numpy==2.5.3",
    "opencv-python==5.0.0.93",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "pgvector>=0.4",
    "pillow==12.3.0",
    "psycopg2-binary>=2.9",
    "pymupdf==1.28.2",
    "pymupdf4llm==1.28.2",
    "python-docx==1.2.0",
    "python-dotenv>=1.0",
    "requests>=2.34.2",
    "sentence-transformers==5.2.1",
    "tabulate==0.10.0",
    "torch==2.14.0",
    "transformers==4.57.6",
    "kernels>=0.4.0",
    "huggingface_hub>=0.27,<1.0",
    "torchvision", 
    "gunicorn>=22.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true