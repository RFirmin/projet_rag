[project]
name = "projet-rag"
version = "0.1.0"
description = "IA assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "django-allauth-ui>=1.8.1",
    "django-allauth[socialaccount]>=65.20.0",
    "easyocr==1.7.2",
    "groq==1.7.0",
    "numpy==2.5.3",
    "opencv-python==5.0.0.93",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "pgvector>=0.4",
    "pillow==12.3.0",
    "psycopg2-binary>=2.9",
    "pymupdf==1.28.2",
    "pymupdf4llm==1.28.2",
    "python-docx==1.2.0",
    "python-dotenv>=1.0",
    "requests>=2.34.2",
    "sentence-transformers==6.1.0",
    "tabulate==0.10.0",
    "torch==2.14.0",
    "transformers==5.17.0",
]

[project.scripts]
projet-rag = "projet_rag:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
