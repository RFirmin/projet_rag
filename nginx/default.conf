server {
    listen 80;
    server_name localhost; # Plus tard, tu mettras ton nom de domaine ici

    location / {
        proxy_pass http://web:8000; # 'web' est le nom du service Django
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Servir les fichiers statiques (CSS, JS) directement par Nginx
    location /static/ {
        alias /app/staticfiles/;
    }
}