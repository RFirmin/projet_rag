services:
  # 1. LA BASE DE DONNÉES
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_db_prod
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. REDIS (pour le cache et le rate limiting)
  redis:
    image: redis:7-alpine
    container_name: rag_redis_prod
    volumes:
      - redisdata:/data

  # 3. DJANGO
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_django_prod
    env_file:
      - .env.prod
    volumes:
      # Monter l'index RAG pour que le conteneur puisse le lire
      - ./chunks_index_all_3.json:/app/chunks_index_all_3.json:ro
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    # On ne met pas de 'ports' ici, car c'est Nginx qui exposera le port 80/443

  # 4. NGINX (Reverse Proxy)
  nginx:
    image: nginx:1.25-alpine
    container_name: rag_nginx_prod
    ports:
      - "80:80" # Expose le port 80 de ta machine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro # Partage les fichiers statiques avec Django
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  static_volume: